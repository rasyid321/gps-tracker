<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time GPS Tracker</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { width: 100%; height: 100vh; }
        body { margin: 0; padding: 0; }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Socket.io Client Script -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        // Inisialisasi peta di koordinat awal (akan diperbarui otomatis oleh GPS)
        const map = L.map('map').setView([0, 0], 2);

        // Menambahkan Layer Peta OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        const markers = {};

        // Menggunakan Geolocation API dari browser HP/Laptop
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
                (position) => {
                    const latitude = position.coords.latitude;
                    const longitude = position.coords.longitude;

                    // Kirim koordinat posisi ke server via WebSocket
                    socket.emit('send-location', { latitude, longitude });
                },
                (error) => {
                    console.error("Gagal mendapatkan lokasi:", error);
                },
                {
                    enableHighAccuracy: true,
                    timeout: 5000,
                    maximumAge: 0
                }
            );
        } else {
            alert("Browser Anda tidak mendukung fitur Geolocation.");
        }

        // Menerima data koordinat perangkat dari server
        socket.on('receive-location', (data) => {
            const { id, latitude, longitude } = data;

            // Pusatkan peta ke lokasi perangkat yang aktif
            map.setView([latitude, longitude], 16);

            if (markers[id]) {
                // Perbarui posisi marker jika sudah ada
                markers[id].setLatLng([latitude, longitude]);
            } else {
                // Buat marker baru jika perangkat baru terhubung
                markers[id] = L.marker([latitude, longitude]).addTo(map)
                    .bindPopup(`ID Perangkat: ${id}`).openPopup();
            }
        });

        // Hapus marker jika perangkat terputus
        socket.on('user-disconnected', (id) => {
            if (markers[id]) {
                map.removeLayer(markers[id]);
                delete markers[id];
            }
        });
    </script>
</body>
</html>
